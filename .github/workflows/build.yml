name: Build APK

# Compila la app Route58 (fork del Traccar Manager) en cada cambio, para verificar que
# arma bien tras el branding. Usa el flavor `regular` (sin Firebase) para no depender del
# google-services.json — el flavor `google` (push) se activa cuando exista el proyecto
# Firebase propio. El APK de depuración queda como artefacto descargable de la corrida.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK de depuración (flavor regular)
        run: ./gradlew assembleRegularDebug --stacktrace

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: route58-manager-debug
          path: app/build/outputs/apk/regular/debug/*.apk
          if-no-files-found: warn
