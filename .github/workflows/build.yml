name: Build Route58 / Motrack Manager

# Compila las apps en cada cambio, para verificar que arman bien tras el branding.
# Dos marcas (dimensión `brand`, #709), ambas con flavor `google` (Firebase/push):
#   - Route58  -> com.fusion58.route58.manager
#   - Motrack  -> com.fusion58.motrack.manager
# Ambos paquetes están registrados en el MISMO proyecto Firebase (route58-26b39) y el
# google-services.json (environment/google-services/route58-manager-android.json) los lista
# a los dos; el plugin elige el correcto por variante.
# Los APK de depuración quedan como artefactos descargables.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Fijado a 24.04: `ubuntu-latest` empezó a migrar a Ubuntu 26 el 2026-10-19 y rompió
    # android-actions/setup-android (sdkmanager --licenses exit 1). 24.04 es el entorno
    # con el que el build pasaba. Revisar al estabilizarse el runner 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-24.04 ya trae el Android SDK preinstalado ($ANDROID_HOME).
      # Evitamos android-actions/setup-android@v3: desde ~2026-10 re-descarga cmdline-tools
      # y 'sdkmanager --licenses' sale con código 1, rompiendo el build. Solo aceptamos
      # las licencias con el SDK preinstalado.
      - name: Aceptar licencias del Android SDK preinstalado
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Compilar Route58 (flavor google, con push)
        run: ./gradlew assembleRoute58GoogleDebug --stacktrace

      - name: Compilar Motrack (flavor google, con push)
        run: ./gradlew assembleMotrackGoogleDebug --stacktrace

      - name: Publicar APK de Route58
        uses: actions/upload-artifact@v4
        with:
          name: route58-manager-debug
          path: app/build/outputs/apk/route58Google/debug/*.apk
          if-no-files-found: warn

      - name: Publicar APK de Motrack
        uses: actions/upload-artifact@v4
        with:
          name: motrack-manager-debug
          path: app/build/outputs/apk/motrackGoogle/debug/*.apk
          if-no-files-found: warn
