plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Firma de release para Google Play (#569). Las credenciales viven en keystore.properties
// (gitignored, fuera del repo). Si el archivo no existe (p.ej. en CI sin secretos), el
// release se arma sin firmar y no rompe el build.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 35
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 42
        versionName '4.6'
        multiDexEnabled true
        // applicationId y SERVER_URL se fijan por marca en productFlavors (dimensión `brand`):
        // route58 -> route.fusion58.com, motrack -> motrack.fusion58.com (#709).
    }
    namespace 'com.fusion58.route58.manager'

    buildFeatures {
        flavorDimensions = ['brand', 'default']
        buildConfig true
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    productFlavors {
        // Dimensión `brand`: una marca por app (mismo código, distinta piel + servidor).
        route58 {
            dimension 'brand'
            isDefault = true
            applicationId 'com.fusion58.route58.manager'
            buildConfigField 'String', 'SERVER_URL', '"https://route.fusion58.com"'
        }
        motrack {
            dimension 'brand'
            applicationId 'com.fusion58.motrack.manager'
            buildConfigField 'String', 'SERVER_URL', '"https://motrack.fusion58.com"'
        }
        // Dimensión `default`: regular (sin Firebase) vs google (con push/FCM).
        regular {
            dimension 'default'
            isDefault = true
            ext.enableCrashlytics = false
        }
        google {
            dimension 'default'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.biometric:biometric-ktx:1.2.0-alpha05'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    googleImplementation platform('com.google.firebase:firebase-bom:33.12.0')
    googleImplementation 'com.google.firebase:firebase-analytics'
    googleImplementation 'com.google.firebase:firebase-crashlytics'
    googleImplementation 'com.google.firebase:firebase-messaging'
}
tasks.register('copyFirebaseConfig', Copy) {
    from '../environment/google-services'
    into '.'
    include 'route58-manager-android.json'
    rename('route58-manager-android.json', 'google-services.json')
}
afterEvaluate {
    tasks.matching { it.name.contains('Google') }.configureEach { task ->
        if (task.name.contains('Regular')) {
            task.enabled false
        } else {
            task.dependsOn copyFirebaseConfig
        }
    }
}
